<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f8f9fa"/>
  <rect x="250" y="30" width="400" height="460" rx="20" fill="#ffffff" stroke="#6750a4" stroke-width="2"/>
  <rect x="250" y="30" width="400" height="50" rx="18" fill="#6750a4"/>
  <text x="320" y="62" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">Attendance Counter (State Management)</text>
  <text x="380" y="130" font-family="Arial" font-size="15" fill="#666">Today Turnout Rate</text>
  <text x="380" y="195" font-family="Arial" font-size="56" font-weight="bold" fill="#6750a4">88.9%</text>
  <!-- Metrics -->
  <rect x="280" y="230" width="100" height="65" rx="10" fill="#e8f5e9"/>
  <text x="315" y="265" font-family="Arial" font-size="22" font-weight="bold" fill="#2e7d32">40</text>
  <text x="305" y="283" font-family="Arial" font-size="11" fill="#2e7d32">Present</text>

  <rect x="400" y="230" width="100" height="65" rx="10" fill="#ffebee"/>
  <text x="440" y="265" font-family="Arial" font-size="22" font-weight="bold" fill="#c62828">5</text>
  <text x="430" y="283" font-family="Arial" font-size="11" fill="#c62828">Absent</text>

  <rect x="520" y="230" width="100" height="65" rx="10" fill="#eceff1"/>
  <text x="555" y="265" font-family="Arial" font-size="22" font-weight="bold" fill="#37474f">45</text>
  <text x="548" y="283" font-family="Arial" font-size="11" fill="#37474f">Total</text>

  <!-- Buttons -->
  <rect x="280" y="330" width="160" height="45" rx="10" fill="#2e7d32"/>
  <text x="315" y="358" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">+ Add Present</text>

  <rect x="460" y="330" width="160" height="45" rx="10" fill="#c62828"/>
  <text x="495" y="358" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">+ Add Absent</text>

  <rect x="330" y="400" width="240" height="40" rx="10" fill="#f5f5f5" stroke="#ccc"/>
  <text x="380" y="425" font-family="Arial" font-size="13" font-weight="bold" fill="#555">Reset Session Counter</text>
